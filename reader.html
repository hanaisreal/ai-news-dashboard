<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 뉴스 리더</title>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI뉴스">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#185FA5">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <style>
    :root {
      --bg:      #f5f5f3;
      --sur:     #ffffff;
      --bdr:     #e8e8e4;
      --t1:      #1a1a1a;
      --t2:      #555;
      --t3:      #999;
      --ac:      #185FA5;
      --ac-bg:   #EBF2FB;
      --sw:      210px;
      --hh:      50px;
    }
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--t1);
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    .hdr {
      position: fixed; top: 0; left: 0; right: 0; height: var(--hh);
      background: var(--sur); border-bottom: 1px solid var(--bdr);
      display: flex; align-items: center; padding: 0 12px; gap: 6px; z-index: 500;
    }
    .hdr-title { font-weight: 700; font-size: 15px; flex: 1; user-select: none; }
    .hbtn {
      background: none; border: none; cursor: pointer;
      padding: 5px 9px; border-radius: 6px; font-size: 12px; color: var(--t2);
      white-space: nowrap; user-select: none;
    }
    .hbtn:active { background: var(--bg); }
    .hbtn.on { color: var(--ac); font-weight: 600; background: var(--ac-bg); }
    #menu-btn { font-size: 18px; display: none; }

    /* ── Layout ─────────────────────────────────────────────────────── */
    .layout {
      position: fixed; top: var(--hh); left: 0; right: 0; bottom: 0;
      display: flex;
    }

    /* ── Sidebar ─────────────────────────────────────────────────────── */
    .sidebar {
      width: var(--sw); background: var(--sur);
      border-right: 1px solid var(--bdr); overflow-y: auto;
      flex-shrink: 0; transition: transform 0.24s ease;
    }
    .sb-sec { padding: 14px 0 6px; }
    .sb-lbl {
      font-size: 10px; font-weight: 700; color: var(--t3);
      text-transform: uppercase; letter-spacing: 0.7px;
      padding: 0 14px 8px; user-select: none;
    }
    .tag {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 14px; cursor: pointer; font-size: 13px;
      user-select: none;
    }
    .tag:active { background: var(--bg); }
    .tag.on { background: var(--ac-bg); color: var(--ac); font-weight: 600; }
    .tag-n { flex: 1; }
    .tag-c {
      font-size: 11px; color: var(--t3); background: var(--bg);
      border-radius: 10px; padding: 1px 7px; min-width: 24px; text-align: center;
    }
    .tag.on .tag-c { background: #D0E4F7; color: var(--ac); }

    /* ── Article list ────────────────────────────────────────────────── */
    .list { flex: 1; overflow-y: auto; overflow-x: hidden; }
    .list-inner { padding: 8px; }

    /* card */
    .card {
      background: var(--sur); border-radius: 10px; margin-bottom: 6px;
      border: 0.5px solid var(--bdr); overflow: hidden; position: relative;
      /* no cursor:pointer — touch handles it */
      will-change: transform;
    }
    .card.read { opacity: 0.4; }

    /* swipe left reveal */
    .sw-l {
      position: absolute; top: 0; left: 0; bottom: 0; width: 80px;
      background: #FEF2F2; display: flex; align-items: center;
      justify-content: center; font-size: 20px; opacity: 0; pointer-events: none;
    }

    .card-in { padding: 11px 13px; }
    .cmeta {
      display: flex; align-items: center; gap: 5px; margin-bottom: 5px;
    }
    .udot {
      width: 6px; height: 6px; background: var(--ac);
      border-radius: 50%; flex-shrink: 0;
    }
    .card.read .udot { display: none; }
    .csrc { font-size: 11px; font-weight: 600; color: var(--ac); }
    .ctag { font-size: 10px; color: var(--t3); }
    .ctime { font-size: 10px; color: var(--t3); margin-left: auto; }
    .ctitle {
      font-size: 13px; font-weight: 600; line-height: 1.4; margin-bottom: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card.read .ctitle { font-weight: 400; color: var(--t2); }
    .csum {
      font-size: 12px; color: var(--t2); line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* ── Reading panel ───────────────────────────────────────────────── */
    .panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: 560px;
      background: var(--sur); border-left: 1px solid var(--bdr);
      transform: translateX(100%);
      transition: transform 0.26s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 400; display: flex; flex-direction: column;
      box-shadow: -4px 0 20px rgba(0,0,0,0.07);
    }
    .panel.open { transform: translateX(0); }

    .phdr {
      height: var(--hh); display: flex; align-items: center;
      gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--bdr);
      flex-shrink: 0;
    }
    .pback {
      background: none; border: none; cursor: pointer;
      font-size: 22px; color: var(--t2);
      padding: 10px 14px;          /* 터치 영역 최소 44px 확보 */
      min-width: 44px; min-height: 44px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px; user-select: none; flex-shrink: 0;
    }
    .pback:active { background: var(--bg); }
    .psrc { font-size: 12px; color: var(--t3); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .pbtn {
      display: flex; align-items: center; gap: 4px;
      padding: 6px 10px; border-radius: 7px; border: none;
      cursor: pointer; font-size: 12px; font-weight: 500; white-space: nowrap;
      user-select: none;
    }
    .pbtn-s { background: var(--bg); color: var(--t2); border: 0.5px solid var(--bdr); }
    .pbtn-s:active { background: #e8e8e4; }
    .pbtn-c { background: #7C3AED; color: #fff; }
    .pbtn-c:active { background: #6D28D9; }

    .pbody { flex: 1; overflow-y: auto; padding: 20px 22px; }
    .ptitle { font-size: 19px; font-weight: 700; line-height: 1.4; letter-spacing: -0.3px; margin-bottom: 14px; }

    /* 한국어 요약 (Claude 생성) */
    .psum-ko {
      font-size: 15px; color: #1a1a1a; line-height: 1.85;
      background: #f0f6ff; border-radius: 10px;
      padding: 14px 16px; margin-bottom: 16px;
      word-break: break-word;
    }
    .psum-ko strong { font-weight: 700; color: #0d4a8a; }
    /* RSS 원문 요약 (영어) — 한국어 있으면 숨김 */
    .psum {
      font-size: 13px; color: var(--t3);
      border-left: 2px solid #d0d8e8; padding-left: 10px;
      line-height: 1.6; margin-bottom: 16px;
    }
    .pbody-divider { border: none; border-top: 1px solid var(--bdr); margin: 0 0 16px; }
    .pbody-content {
      font-size: 15px; color: var(--t1); line-height: 1.85;
      word-break: break-word;
    }
    .pbody-content strong { font-weight: 700; }
    .pbody-notext {
      font-size: 13px; color: var(--t3); font-style: italic;
      padding: 20px 0; text-align: center;
    }

    .pftr {
      padding: 12px 18px; border-top: 1px solid var(--bdr);
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .rbtn {
      background: none; border: 0.5px solid var(--bdr);
      border-radius: 7px; padding: 6px 12px; font-size: 12px;
      cursor: pointer; color: var(--t2); user-select: none;
    }
    .rbtn:active { background: var(--bg); }
    .rbtn.done { color: #16A34A; border-color: #16A34A; background: #F0FDF4; }
    .orig { margin-left: auto; font-size: 12px; color: var(--ac); text-decoration: none; }
    .orig:hover { text-decoration: underline; }

    /* ── Toast ──────────────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #111; color: #fff; padding: 9px 16px;
      border-radius: 8px; font-size: 13px; z-index: 9000;
      opacity: 0; transition: opacity 0.22s, transform 0.22s;
      pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Overlay ─────────────────────────────────────────────────────── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.32); z-index: 350;
      opacity: 0; transition: opacity 0.22s;
      pointer-events: none; /* 비활성 시 터치 차단 안 함 */
    }
    .overlay.vis { opacity: 1; pointer-events: auto; }

    /* ── Markdown rendering ──────────────────────────────────────────── */
    .md p               { margin-bottom: 14px; }
    .md p:last-child    { margin-bottom: 0; }
    .md strong          { font-weight: 700; }
    .md em              { font-style: italic; }
    .md h1,.md h2,.md h3 {
      font-weight: 700; line-height: 1.3;
      margin: 18px 0 8px; letter-spacing: -0.3px;
    }
    .md h1 { font-size: 18px; }
    .md h2 { font-size: 16px; }
    .md h3 { font-size: 14px; }
    .md ul,.md ol { padding-left: 20px; margin-bottom: 12px; }
    .md li  { margin-bottom: 5px; line-height: 1.6; }
    .md blockquote {
      border-left: 3px solid #c8d8ee;
      margin: 0 0 12px; padding: 8px 12px;
      color: var(--t2); font-style: italic;
    }
    .md code {
      background: #f0f2f4; border-radius: 4px;
      padding: 1px 5px; font-size: 0.9em; font-family: monospace;
    }
    .md hr  { border: none; border-top: 1px solid var(--bdr); margin: 16px 0; }

    /* ── Story ───────────────────────────────────────────────────────── */
    .story-wrap {
      margin: 8px 8px 0;
      background: linear-gradient(135deg, #EBF2FB 0%, #F0EBF8 100%);
      border: 0.5px solid #c8d8ee; border-radius: 12px; overflow: hidden;
    }
    .story-hdr {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; cursor: pointer; user-select: none;
    }
    .story-hdr-left { display: flex; align-items: center; gap: 7px; }
    .story-hdr-title { font-size: 13px; font-weight: 700; color: #185FA5; }
    .story-hdr-sub { font-size: 11px; color: #7B9EC7; }
    .story-chev { font-size: 11px; color: #7B9EC7; transition: transform 0.2s; }
    .story-chev.open { transform: rotate(180deg); }
    .story-body {
      padding: 0 14px 16px; font-size: 14px; line-height: 1.85;
      color: #2a2a2a; word-break: break-word;
      display: none;
    }
    .story-body.open { display: block; }
    /* 스토리 첫 문단 살짝 크게 */
    .story-body p:first-child { font-size: 15px; }
    /* 스토리 볼드: 파란 포인트 컬러 */
    .story-body strong { color: #185FA5; }

    /* ── Story visual ────────────────────────────────────────────────── */
    /* 💡 마지막 줄 강조 */
    .story-highlight {
      background: linear-gradient(135deg, #FFFBEB, #FEF9E7);
      border-left: 3px solid #F59E0B;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 600;
      font-size: 14px !important;
      margin-top: 18px;
      color: #78350F;
    }
    .story-body > p { margin-bottom: 16px; }
    .story-body > p:first-child { font-size: 15px; font-weight: 500; }
    .story-body strong { color: #185FA5; }
    /* 스토리 스코프 전환 문장 — "결국..." */
    .story-body > p:not(:first-child):not(:last-child) { color: #2a2a2a; }

    /* ── Settings modal ──────────────────────────────────────────────── */
    .modal-bg {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); z-index: 800;
      align-items: center; justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal-card {
      background: var(--sur); border-radius: 16px;
      padding: 24px; width: 90%; max-width: 400px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.2);
    }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .modal-sub { font-size: 12px; color: var(--t3); margin-bottom: 16px; }
    .modal-label { font-size: 12px; font-weight: 600; color: var(--t2); margin-bottom: 6px; }
    .modal-input {
      width: 100%; border: 1px solid var(--bdr); border-radius: 8px;
      padding: 9px 12px; font-size: 13px; font-family: monospace;
      outline: none; margin-bottom: 6px;
    }
    .modal-input:focus { border-color: var(--ac); }
    .modal-hint { font-size: 11px; color: var(--t3); margin-bottom: 16px; }
    .modal-btns { display: flex; gap: 8px; }
    .modal-btn {
      flex: 1; padding: 9px; border-radius: 8px; border: none;
      cursor: pointer; font-size: 13px; font-weight: 600;
    }
    .modal-btn-primary { background: var(--ac); color: #fff; }
    .modal-btn-primary:active { background: #0e4a82; }
    .modal-btn-secondary { background: var(--bg); color: var(--t2); }

    /* ── Float explain button ────────────────────────────────────────── */
    .float-explain {
      display: none; position: fixed; z-index: 700;
      background: #7C3AED; color: #fff;
      border: none; border-radius: 20px;
      padding: 6px 12px; font-size: 12px; font-weight: 600;
      cursor: pointer; box-shadow: 0 4px 12px rgba(124,58,237,0.4);
      white-space: nowrap; gap: 4px; align-items: center;
      transform: translateX(-50%);
    }
    .float-explain:active { background: #6D28D9; }

    /* ── Explain popup ───────────────────────────────────────────────── */
    .explain-popup {
      display: none; position: fixed;
      bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 560px;
      background: var(--sur); border-radius: 16px 16px 0 0;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.12);
      z-index: 700; padding: 16px 20px 32px;
    }
    .explain-popup.open { display: block; }
    .explain-hdr {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .explain-hdr-title { font-size: 13px; font-weight: 700; color: #7C3AED; }
    .explain-close {
      background: none; border: none; cursor: pointer;
      font-size: 18px; color: var(--t3); padding: 2px 6px;
    }
    .explain-quote {
      font-size: 12px; color: var(--t3); font-style: italic;
      border-left: 2px solid #D8B4FE; padding-left: 8px;
      margin-bottom: 12px; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .explain-body {
      font-size: 14px; color: var(--t1); line-height: 1.8;
      word-break: break-word;
    }
    .explain-body.loading {
      color: var(--t3); font-style: italic;
    }
    .explain-dots::after {
      content: ''; animation: dots 1.2s infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      33%  { content: '.'; }
      66%  { content: '..'; }
      100% { content: '...'; }
    }

    /* ── States ─────────────────────────────────────────────────────── */
    .state { padding: 60px 20px; text-align: center; color: var(--t3); font-size: 14px; }
    .state-icon { font-size: 36px; margin-bottom: 10px; }

    /* ── Mobile ─────────────────────────────────────────────────────── */
    @media (max-width: 700px) {
      #menu-btn { display: flex !important; }
      .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0; z-index: 460;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .overlay { display: block; }
      .panel { width: 100%; border-left: none; }
    }
  </style>
</head>
<body>

<div class="hdr">
  <button class="hbtn" id="menu-btn" onclick="toggleSb()">☰</button>
  <div class="hdr-title">📰 AI 뉴스</div>
  <button class="hbtn on"  id="f-all"    onclick="setF('all')">전체</button>
  <button class="hbtn"     id="f-unread" onclick="setF('unread')">안읽음</button>
  <button class="hbtn"     id="f-today"  onclick="setF('today')">오늘</button>
  <button class="hbtn"     onclick="openSettings()" title="API 키 설정">⚙️</button>
</div>

<!-- 설정 모달 -->
<div class="modal-bg" id="settings-modal" onclick="if(event.target===this)closeSettings()">
  <div class="modal-card">
    <div class="modal-title">⚙️ 설정</div>
    <div class="modal-sub">Anthropic API 키를 저장하면 텍스트 선택 시 즉석 AI 설명을 볼 수 있어요.</div>
    <div class="modal-label">Anthropic API 키</div>
    <input class="modal-input" id="api-key-input" type="password" placeholder="sk-ant-api03-...">
    <div class="modal-hint">console.anthropic.com에서 발급 · 이 기기에만 저장됩니다</div>
    <div class="modal-btns">
      <button class="modal-btn modal-btn-secondary" onclick="closeSettings()">닫기</button>
      <button class="modal-btn modal-btn-primary" onclick="saveApiKey()">저장</button>
    </div>
  </div>
</div>

<!-- 텍스트 선택 → 설명 버튼 -->
<button class="float-explain" id="float-explain" onclick="triggerExplain()">
  💡 설명하기
</button>

<!-- 설명 팝업 -->
<div class="explain-popup" id="explain-popup">
  <div class="explain-hdr">
    <span class="explain-hdr-title">💡 AI 설명</span>
    <button class="explain-close" onclick="closeExplain()">✕</button>
  </div>
  <div class="explain-quote" id="explain-quote"></div>
  <div class="explain-body" id="explain-body"></div>
</div>

<div class="layout">
  <div class="sidebar" id="sb">
    <div class="sb-sec">
      <div class="sb-lbl">태그</div>
      <div id="tag-list">
        <div class="tag on" onclick="selTag(null)">
          <span class="tag-n">전체</span>
          <span class="tag-c" id="c-all">…</span>
        </div>
      </div>
    </div>
  </div>

  <div class="list" id="list">
    <!-- 스토리 섹션 (데이터 로드 후 채워짐) -->
    <div class="story-wrap" id="story-wrap" style="display:none">
      <div class="story-hdr" onclick="toggleStory()">
        <div class="story-hdr-left">
          <span class="story-hdr-title">📖 오늘의 AI 브리핑</span>
          <span class="story-hdr-sub" id="story-date"></span>
        </div>
        <span class="story-chev" id="story-chev">▼</span>
      </div>
      <div class="story-body" id="story-body"></div>
    </div>

    <div id="list-placeholder" class="state"><div class="state-icon">⏳</div>불러오는 중…</div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<div class="panel" id="panel">
  <div class="phdr">
    <button class="pback" onclick="closePanel()">←</button>
    <span class="psrc" id="p-src"></span>
    <button class="pbtn pbtn-s" id="p-save" onclick="saveArt()">💾 저장</button>
    <button class="pbtn pbtn-c" onclick="openClaude()">💬 Claude</button>
  </div>
  <div class="pbody">
    <div class="ptitle"  id="p-title"></div>
    <div class="psum-ko" id="p-sum-ko" style="display:none"></div>
    <div class="psum"    id="p-sum"    style="display:none"></div>
    <hr  class="pbody-divider" id="p-divider" style="display:none">
    <div id="p-content"></div>
  </div>
  <div class="pftr">
    <button class="rbtn" id="p-rbtn" onclick="toggleRead()">✓ 읽음 표시</button>
    <a class="orig" id="p-link" target="_blank" rel="noopener">원문 보기 →</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Markdown helper ───────────────────────────────────────────────────────────
marked.setOptions({ breaks: true, gfm: true });
function md(text) {
  if (!text) return '';
  return marked.parse(text);
}
// 카드처럼 인라인(한 줄)으로 쓸 때 — <p> 태그 제거
function mdInline(text) {
  if (!text) return '';
  return marked.parseInline(text);
}

// ── Supabase ──────────────────────────────────────────────────────────────────
const { createClient } = window.supabase;
const sb = createClient(
  'https://yosnuhgjwecgsfyodopv.supabase.co',

// ── State ─────────────────────────────────────────────────────────────────────
let arts      = [];
let readIds   = new Set(JSON.parse(localStorage.getItem('read') || '[]'));
let curTag    = null;
let curFilter = 'all';
let curArt    = null;
const today   = new Date().toISOString().slice(0, 10);

// ── Boot ──────────────────────────────────────────────────────────────────────
(async () => {
  const { data, error } = await sb
    .from('articles')
    .select('id, title, url, summary, summary_ko, content, published_at, date, feeds(name, tag)')
    .order('published_at', { ascending: false })
    .limit(300);

  if (error || !data) {
    document.getElementById('list').innerHTML =
      `<div class="state"><div class="state-icon">⚠️</div>데이터 로드 실패</div>`;
    return;
  }

  arts = data.map(a => ({
    id:   a.id,
    ttl:  a.title,
    url:  a.url,
    sum:  a.summary    || '',
    sumKo: a.summary_ko || '',
    body: a.content    || '',
    src:  a.feeds?.name || '알 수 없음',
    tag:  a.feeds?.tag  || '기타',
    pub:  a.published_at,
    dt:   a.date,
  }));

  renderTags();
  renderList();
  loadStory();
})();

async function loadStory() {
  const { data } = await sb
    .from('reports')
    .select('story, generated_at')
    .eq('date', today)
    .maybeSingle();

  if (!data?.story) return;

  const bodyEl = document.getElementById('story-body');
  bodyEl.classList.add('md');
  bodyEl.innerHTML = md(data.story);

  // 💡 로 시작하는 마지막 p 강조 처리
  const lastP = bodyEl.querySelector('p:last-child');
  if (lastP && lastP.textContent.trimStart().startsWith('💡')) {
    lastP.classList.add('story-highlight');
  }

  document.getElementById('story-date').textContent = data.generated_at || '';
  document.getElementById('story-wrap').style.display = 'block';
  toggleStory(true);
}

function toggleStory(forceOpen) {
  const body = document.getElementById('story-body');
  const chev = document.getElementById('story-chev');
  const isOpen = body.classList.contains('open');
  const shouldOpen = forceOpen !== undefined ? forceOpen : !isOpen;
  body.classList.toggle('open', shouldOpen);
  chev.classList.toggle('open', shouldOpen);
}

// ── Tags ──────────────────────────────────────────────────────────────────────
function renderTags() {
  const counts = {};
  arts.forEach(a => counts[a.tag] = (counts[a.tag] || 0) + 1);
  document.getElementById('c-all').textContent = arts.length;

  const tl = document.getElementById('tag-list');
  tl.querySelectorAll('[data-d]').forEach(el => el.remove());

  Object.entries(counts).sort(([a], [b]) => a.localeCompare(b)).forEach(([tag, n]) => {
    const el = document.createElement('div');
    el.className = 'tag' + (curTag === tag ? ' on' : '');
    el.dataset.d = '1';
    el.innerHTML = `<span class="tag-n">${esc(tag)}</span><span class="tag-c">${n}</span>`;
    el.addEventListener('click', () => selTag(tag));
    tl.appendChild(el);
  });
}

function selTag(tag) {
  curTag = tag;
  document.querySelectorAll('.tag').forEach(el => el.classList.remove('on'));
  if (tag === null) document.querySelector('.tag').classList.add('on');
  else document.querySelectorAll('[data-d]').forEach(el => {
    if (el.querySelector('.tag-n').textContent === tag) el.classList.add('on');
  });
  renderList();
  if (window.innerWidth <= 700) closeSb();
}

// ── Filter ────────────────────────────────────────────────────────────────────
function setF(f) {
  curFilter = f;
  ['all', 'unread', 'today'].forEach(k =>
    document.getElementById('f-' + k).classList.toggle('on', k === f));
  renderList();
}

function getArts() {
  let a = arts;
  if (curTag)              a = a.filter(x => x.tag === curTag);
  if (curFilter==='unread') a = a.filter(x => !readIds.has(x.id));
  if (curFilter==='today')  a = a.filter(x => x.dt === today);
  return a;
}

// ── Render list ───────────────────────────────────────────────────────────────
function renderList() {
  // placeholder 제거
  document.getElementById('list-placeholder')?.remove();

  // 기존 카드 영역만 교체
  document.getElementById('inner')?.remove();
  const list = document.getElementById('list');

  const filtered = getArts();
  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.id = 'inner';
    empty.innerHTML = `<div class="state"><div class="state-icon">📭</div>아티클이 없어요</div>`;
    list.appendChild(empty);
    return;
  }

  const inner = document.createElement('div');
  inner.id = 'inner';
  inner.className = 'list-inner';
  filtered.forEach(a => inner.appendChild(mkCard(a)));
  list.appendChild(inner);
}

function mkCard(a) {
  const card = document.createElement('div');
  card.className = 'card' + (readIds.has(a.id) ? ' read' : '');
  card.dataset.id = a.id;
  card.innerHTML = `
    <div class="sw-l">📭</div>
    <div class="card-in">
      <div class="cmeta">
        <div class="udot"></div>
        <span class="csrc">${esc(a.src)}</span>
        <span class="ctag">${esc(a.tag)}</span>
        <span class="ctime">${relT(a.pub)}</span>
      </div>
      <div class="ctitle">${esc(a.ttl)}</div>
      ${(a.sumKo || a.sum) ? `<div class="csum">${mdInline((a.sumKo || a.sum).slice(0, 250))}</div>` : ''}
    </div>`;

  addTouch(card, a);
  return card;
}

// ── Touch handler (tap + swipe left) ─────────────────────────────────────────
function addTouch(card, a) {
  let sx, sy, dir = null; // dir: 'h' | 'v' | null

  function reset() {
    card.style.transform = '';
    const sl = card.querySelector('.sw-l');
    if (sl) sl.style.opacity = '0';
    dir = null;
  }

  card.addEventListener('touchstart', e => {
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    dir = null;
  }, { passive: true });

  card.addEventListener('touchmove', e => {
    if (sx === undefined) return;
    const dx = e.touches[0].clientX - sx;
    const dy = e.touches[0].clientY - sy;

    // Direction not yet decided
    if (!dir) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      dir = Math.abs(dx) >= Math.abs(dy) ? 'h' : 'v';
    }
    if (dir === 'v') { reset(); return; }

    // Horizontal — only left swipe, and not from iOS back edge
    if (dx >= 0 || sx < 30) return;

    e.preventDefault(); // prevent page scroll during horizontal swipe
    const clamped = Math.max(dx, -100);
    card.style.transform = `translateX(${clamped}px)`;
    const sl = card.querySelector('.sw-l');
    if (sl) sl.style.opacity = String(Math.min(1, (-dx - 20) / 50));
  }, { passive: false });

  card.addEventListener('touchend', e => {
    if (sx === undefined) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;

    const isTap  = Math.abs(dx) < 8 && Math.abs(dy) < 8;
    const isSwipeL = dir === 'h' && dx < -60 && sx >= 30;

    reset();
    sx = undefined;

    if (isTap) {
      e.preventDefault(); // suppress ghost click 300ms later
      openPanel(a);
    } else if (isSwipeL) {
      markRead(a.id, card, true);
    }
  }, { passive: false });

  // Desktop fallback (won't fire on mobile after e.preventDefault() above)
  card.addEventListener('click', () => openPanel(a));
}

// ── Read ──────────────────────────────────────────────────────────────────────
function markRead(id, card, animate) {
  readIds.add(id);
  save();
  if (!card) return;
  card.classList.add('read');
  if (animate && curFilter === 'unread') {
    card.style.transition = 'opacity 0.22s, transform 0.22s';
    card.style.opacity = '0';
    card.style.transform = 'translateX(-100%)';
    setTimeout(() => card.remove(), 240);
  }
}

function toggleRead() {
  if (!curArt) return;
  const id = curArt.id;
  const btn = document.getElementById('p-rbtn');
  const card = document.querySelector(`[data-id="${id}"]`);
  if (readIds.has(id)) {
    readIds.delete(id); save();
    btn.textContent = '✓ 읽음 표시'; btn.classList.remove('done');
    card?.classList.remove('read');
  } else {
    readIds.add(id); save();
    btn.textContent = '✓ 읽음'; btn.classList.add('done');
    card?.classList.add('read');
  }
}

function save() { localStorage.setItem('read', JSON.stringify([...readIds])); }

// ── Panel ─────────────────────────────────────────────────────────────────────
function openPanel(a) {
  curArt = a;
  document.getElementById('p-src').textContent  = `${a.src}  ·  ${a.tag}`;
  document.getElementById('p-title').textContent = a.ttl;
  document.getElementById('p-link').href         = a.url;
  document.getElementById('p-save').textContent  = '💾 저장';

  // 한국어 요약 (Claude 생성) — 마크다운 렌더링
  const koEl = document.getElementById('p-sum-ko');
  if (a.sumKo) {
    koEl.classList.add('md');
    koEl.innerHTML     = md(a.sumKo);
    koEl.style.display = '';
  } else {
    koEl.innerHTML     = '';
    koEl.style.display = 'none';
  }

  // 영어 RSS 요약 (한국어 없을 때만)
  const sumEl = document.getElementById('p-sum');
  sumEl.innerHTML     = a.sumKo ? '' : esc(a.sum || '');
  sumEl.style.display = (!a.sumKo && a.sum) ? '' : 'none';

  // 본문
  const divEl     = document.getElementById('p-divider');
  const contentEl = document.getElementById('p-content');
  divEl.style.display = (a.sumKo || a.sum) ? '' : 'none';
  if (a.body) {
    contentEl.className = 'pbody-content md';
    contentEl.innerHTML = md(a.body);
  } else {
    contentEl.className   = 'pbody-notext';
    contentEl.textContent = '본문을 가져올 수 없어요. 원문 보기를 눌러주세요.';
  }

  const rb = document.getElementById('p-rbtn');
  rb.textContent = readIds.has(a.id) ? '✓ 읽음' : '✓ 읽음 표시';
  rb.classList.toggle('done', readIds.has(a.id));

  document.getElementById('panel').classList.add('open');
  if (window.innerWidth <= 700) showOv();

  // 2초 뒤 자동 읽음
  setTimeout(() => {
    if (curArt?.id !== a.id || readIds.has(a.id)) return;
    readIds.add(a.id); save();
    document.querySelector(`[data-id="${a.id}"]`)?.classList.add('read');
    rb.textContent = '✓ 읽음'; rb.classList.add('done');
  }, 2000);
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  hideOv(); curArt = null;
}

// 패널 오른쪽 스와이프 → 닫기 (iOS 뒤로가기 방식)

// ── Claude ────────────────────────────────────────────────────────────────────

  const ctx = arts.slice(0, 40).map(a => `• [${a.tag}] ${a.src}: ${a.ttl}`).join('\n');
  const prompt = `다음 AI 뉴스 아티클을 같이 분석하고 싶어.

## 이 글
제목: ${curArt.ttl}
출처: ${curArt.src} (${curArt.tag})
내용: ${curArt.sum}
링크: ${curArt.url}

## 오늘 전체 AI 뉴스 컨텍스트 (${arts.length}개 중 일부)
${ctx}

이 글을 오늘의 AI 트렌드 맥락에서 분석해줘. HCI·인간-AI 상호작용 연구 관점에서 어떤 의미인지, 이 기술이 어디로 향하는지도 이야기해줘.`;

  navigator.clipboard.writeText(prompt)
    .then(() => showToast('📋 복사됨 — claude.ai에 붙여넣기 하세요'))
    .catch(() => showToast('claude.ai에서 대화하세요'));
  window.open('https://claude.ai/new', '_blank');
}

// ── Save ──────────────────────────────────────────────────────────────────────
async function saveArt() {
  if (!curArt) return;
  const { data: folders } = await sb.from('folders').select('*').order('created_at');
  if (!folders?.length) { showToast('Streamlit 앱에서 폴더를 먼저 만드세요'); return; }
  const names = folders.map((f, i) => `${i + 1}. ${f.name}`).join('\n');
  const sel = prompt(`저장할 폴더:\n${names}`);
  const idx = parseInt(sel) - 1;
  if (isNaN(idx) || idx < 0 || idx >= folders.length) return;
  await sb.from('bookmarks').upsert({
    type: 'article', title: curArt.ttl, url: curArt.url,
    source: curArt.src, summary: curArt.sum?.slice(0, 300),
    folder_id: folders[idx].id,
  }, { onConflict: 'url,folder_id', ignoreDuplicates: true });
  document.getElementById('p-save').textContent = '✓ 저장됨';
  showToast(`📁 ${folders[idx].name}에 저장됐어요`);
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function toggleSb() {
  const s = document.getElementById('sb');
  s.classList.toggle('open');
  s.classList.contains('open') ? showOv() : hideOv();
}
function closeSb()  { document.getElementById('sb').classList.remove('open'); hideOv(); }
function showOv()   { document.getElementById('overlay').classList.add('vis'); }
function hideOv()   { document.getElementById('overlay').classList.remove('vis'); }
function closeAll() { closePanel(); closeSb(); }

let _tt;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('show'), 2800);
}

function relT(iso) {
  if (!iso) return '';
  const m = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (m < 60)   return `${m}분 전`;
  if (m < 1440) return `${Math.floor(m / 60)}시간 전`;
  return `${Math.floor(m / 1440)}일 전`;
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── Settings ──────────────────────────────────────────────────────────────────
function openSettings() {
  const key = localStorage.getItem('anth_key') || '';
  document.getElementById('api-key-input').value = key ? '••••••••' + key.slice(-6) : '';
  document.getElementById('settings-modal').classList.add('open');
}
function closeSettings() {
  document.getElementById('settings-modal').classList.remove('open');
}
function saveApiKey() {
  const val = document.getElementById('api-key-input').value.trim();
  if (val && !val.startsWith('•')) {
    localStorage.setItem('anth_key', val);
    showToast('✅ API 키 저장됨');
  }
  closeSettings();
}

// ── Text selection → float explain ───────────────────────────────────────────
let _selText = '';
let _selTimer = null;

document.addEventListener('selectionchange', () => {
  clearTimeout(_selTimer);
  _selTimer = setTimeout(() => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) { hideFloatExplain(); return; }
    const text = sel.toString().trim();
    if (text.length < 8) { hideFloatExplain(); return; }

    // 패널 내부에서만
    const panel = document.getElementById('panel');
    const range = sel.getRangeAt(0);
    if (!panel.contains(range.commonAncestorContainer)) { hideFloatExplain(); return; }

    _selText = text;
    const rect = range.getBoundingClientRect();
    const btn  = document.getElementById('float-explain');
    btn.style.display = 'flex';
    // 선택 영역 바로 아래, 화면 경계 안에 배치
    const top = Math.min(rect.bottom + 8, window.innerHeight - 60);
    const left = Math.max(60, Math.min(rect.left + rect.width / 2, window.innerWidth - 60));
    btn.style.top  = top  + 'px';
    btn.style.left = left + 'px';
  }, 120);
});

function hideFloatExplain() {
  document.getElementById('float-explain').style.display = 'none';
}

// ── Explain ───────────────────────────────────────────────────────────────────
async function triggerExplain() {
  hideFloatExplain();
  const apiKey = localStorage.getItem('anth_key');
  if (!apiKey) { openSettings(); showToast('API 키를 먼저 저장해주세요'); return; }
  if (!_selText) return;

  // 팝업 열기 + 로딩
  const popup  = document.getElementById('explain-popup');
  const quote  = document.getElementById('explain-quote');
  const body   = document.getElementById('explain-body');
  quote.textContent = `"${_selText.slice(0, 120)}${_selText.length > 120 ? '…' : ''}"`;
  body.className    = 'explain-body loading';
  body.innerHTML    = '<span class="explain-dots">생각 중</span>';
  popup.classList.add('open');

  // 컨텍스트: 아티클 제목 + 한국어 요약
  const ctx = [curArt?.ttl, curArt?.sumKo].filter(Boolean).join('\n');
  const prompt =
    `아티클: "${curArt?.ttl || ''}"\n` +
    (ctx ? `컨텍스트: ${ctx.slice(0, 400)}\n\n` : '') +
    `선택한 부분: "${_selText}"\n\n` +
    `이 부분을 쉽게 설명해줘. 배경지식 없어도 이해할 수 있게, 2~3문장으로. 한국어로.`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 400,
        messages: [{ role: 'user', content: prompt }],
      }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      body.className   = 'explain-body';
      body.textContent = 'API 오류: ' + (err.error?.message || resp.status);
      return;
    }

    const data = await resp.json();
    body.className = 'explain-body md';
    body.innerHTML = md(data.content[0].text);
  } catch (e) {
    body.className   = 'explain-body';
    body.textContent = '오류: ' + e.message;
  }
}

function closeExplain() {
  document.getElementById('explain-popup').classList.remove('open');
}
